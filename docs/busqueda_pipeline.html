<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar de Riesgo Social — Consulta</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #F1F5F9;
      font-family: system-ui, -apple-system, sans-serif; color: #1A202C;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Top bar */
    .topbar { background: #1B4F72; padding: 12px 28px; display: flex; align-items: center; gap: 12px; }
    .topbar .logo { width: 28px; height: 28px; border-radius: 6px; background: #10B981; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .topbar .title { color: white; font-weight: 700; font-size: 14px; line-height: 1; }
    .topbar .subtitle { color: rgba(255,255,255,0.55); font-size: 10px; margin-top: 1px; }

    .container { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
    .head { margin-bottom: 28px; text-align: center; }
    .head h1 { font-size: 26px; font-weight: 700; color: #1B4F72; margin: 0 0 6px; }
    .head p { font-size: 13px; color: #64748B; margin: 0; }

    .card {
      background: white; border-radius: 16px; padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07); border: 1px solid #E2E8F0;
    }

    label.field { font-size: 12px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
    .group { margin-bottom: 20px; }

    .input, select.input {
      width: 100%; padding: 11px 14px; border: 2px solid #E2E8F0; border-radius: 10px;
      font-size: 14px; outline: none; color: #1A202C; background: white; transition: border-color 0.15s;
    }
    .input:focus, select.input:focus { border-color: #1B4F72; }
    select.input.sel { border-color: #10B981; }

    /* Chips de fuentes */
    .fuentes-panel { margin-top: 12px; animation: fadeIn 0.25s ease; }
    .fuentes-head { font-size: 11px; font-weight: 600; color: #64748B; margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .chip-green { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
    .chip-blue { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }

    .grid-fechas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn-primary {
      width: 100%; padding: 13px 0; background: #1B4F72; color: white; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px;
    }
    .btn-primary:disabled { background: #CBD5E1; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #64748B; cursor: pointer; }

    /* Loading */
    .card-center { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border: 1px solid #E2E8F0; text-align: center; animation: fadeIn 0.3s ease; }
    .spinner { width: 56px; height: 56px; border-radius: 50%; background: #1B4F72; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; animation: spin 1s linear infinite; }
    .loading-title { font-size: 16px; font-weight: 600; color: #1B4F72; margin-bottom: 6px; }
    .loading-etapa { font-size: 13px; color: #64748B; margin-bottom: 6px; height: 20px; }
    .loading-tiempo { font-size: 12px; color: #475569; font-variant-numeric: tabular-nums; margin-bottom: 20px; }
    .barra { width: 100%; height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    /* Barra DETERMINADA anclada a la fase real (GET /progreso): arranca en 0% y el
       ancho lo maneja el JS. La transición suaviza cada paso del easing; no hay
       porcentaje falso por tiempo, el avance sigue la fase confirmada por el poll. */
    .barra > div { height: 100%; width: 0%; background: linear-gradient(90deg, #1B4F72, #10B981); border-radius: 3px; transition: width 0.2s linear; }
    .dots { display: flex; justify-content: space-between; margin-bottom: 24px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #E2E8F0; transition: background 0.3s; }
    .dot.on { background: #10B981; }

    /* Error */
    .card-error { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border: 1px solid #FECACA; text-align: center; animation: fadeIn 0.3s ease; }
    .err-icon { width: 48px; height: 48px; border-radius: 50%; background: #FEF2F2; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: #DC2626; font-size: 24px; font-weight: 700; }
    .err-title { font-size: 15px; font-weight: 600; color: #991B1B; margin-bottom: 6px; }
    .err-msg { font-size: 12px; color: #64748B; margin-bottom: 20px; word-break: break-word; }
    /* Variante advertencia (forzable): el territorio no está en la división oficial,
       pero se puede analizar igual. Ámbar en vez de rojo. */
    .card-error.warn { border-color: #FDE68A; }
    .card-error.warn .err-icon { background: #FFFBEB; color: #B45309; }
    .card-error.warn .err-title { color: #92400E; }
    .err-actions { display: flex; gap: 10px; justify-content: center; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="title">Radar de Riesgo Social</div>
      <div class="subtitle">Pipeline FNCE — UPB</div>
    </div>
  </div>

  <div class="container">

    <!-- FORMULARIO -->
    <section id="form">
      <div class="head">
        <h1>Nueva consulta</h1>
        <p>Elige un departamento y, si quieres, un lugar específico para analizar los indicadores de riesgo social</p>
      </div>

      <div class="card">
        <!-- Departamento (obligatorio) -->
        <div class="group">
          <label class="field" for="sel-departamento">Departamento</label>
          <select id="sel-departamento" class="input"></select>
          <div id="fuentes-panel" class="fuentes-panel" hidden>
            <div class="fuentes-head">Fuentes de prensa a consultar</div>
            <div id="chips-fuentes" class="chips"></div>
          </div>
        </div>

        <!-- Lugar específico (opcional) -->
        <div class="group">
          <label class="field" for="input-lugar">Lugar específico</label>
          <input id="input-lugar" class="input" autocomplete="off" placeholder="Municipio, vereda o corregimiento (opcional)" />
        </div>

        <!-- Fechas -->
        <div class="group grid-fechas">
          <div>
            <label class="field" for="fecha-inicio">Fecha inicio</label>
            <input id="fecha-inicio" class="input" type="date" />
          </div>
          <div>
            <label class="field" for="fecha-fin">Fecha fin</label>
            <input id="fecha-fin" class="input" type="date" />
          </div>
        </div>

        <button id="btn-analizar" class="btn-primary" disabled>Selecciona un departamento</button>
      </div>
    </section>

    <!-- LOADING -->
    <section id="estado-loading" class="card-center" hidden>
      <div class="spinner">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="loading-title">Analizando <span id="loading-territorio"></span></div>
      <div id="loading-etapa" class="loading-etapa"></div>
      <div id="loading-tiempo" class="loading-tiempo"></div>
      <div class="barra"><div id="barra-progreso"></div></div>
      <div id="dots" class="dots"></div>
    </section>

    <!-- ERROR / ADVERTENCIA (el título, el estilo y los botones se ajustan en JS
         según forzable y según si el rechazo es de validación) -->
    <section id="estado-error" class="card-error" hidden>
      <div class="err-icon">!</div>
      <div id="err-title" class="err-title">No se pudo completar el análisis</div>
      <div id="error-msg" class="err-msg"></div>
      <div class="err-actions">
        <button id="btn-reintentar" class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0;">Reintentar</button>
        <!-- Solo visible cuando la API marca el rechazo como forzable (vereda/
             corregimiento que no figura en la tabla). Nunca por string matching. -->
        <button id="btn-forzar-error" class="btn-outline" hidden>Analizar de todas formas</button>
        <button id="btn-nueva-error" class="btn-outline">Nueva consulta</button>
      </div>
    </section>

    <!-- SUGERENCIA (municipio no exacto) -->
    <section id="estado-sugerencia" class="card-center" hidden>
      <div class="err-title" id="sug-msg" style="color:#1B4F72;margin-bottom:16px;">¿Quisiste decir alguno de estos?</div>
      <div id="sug-botones" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
      <button id="btn-buscar-igual" class="btn-outline">No, buscar igual</button>
    </section>

  </div>

  <script>
    "use strict";

    // API configurable por querystring: ...html?api=https://tu-backend
    const params = new URLSearchParams(window.location.search);
    const API_BASE = params.get("api") || "http://localhost:8000";

    const DEPARTAMENTOS = [
      "Amazonas", "Antioquia", "Arauca", "Atlántico", "Bolívar", "Boyacá",
      "Caldas", "Caquetá", "Casanare", "Cauca", "Cesar", "Chocó",
      "Córdoba", "Cundinamarca", "Guainía", "Guaviare", "Huila", "La Guajira",
      "Magdalena", "Meta", "Nariño", "Norte de Santander", "Putumayo", "Quindío",
      "Risaralda", "San Andrés", "Santander", "Sucre", "Tolima",
      "Valle del Cauca", "Vaupés", "Vichada"
    ];

    // Mismo mapa que MAPA_TERRITORIO_PERIODICOS de src/api.py (claves normalizadas).
    // Los departamentos que no figuran caen a ["eltiempo"], igual que la API.
    const MAPA_TERRITORIO_PERIODICOS = {
      "antioquia":          ["elcolombiano", "eltiempo"],
      "atlantico":          ["elheraldo", "eltiempo"],
      "bolivar":            ["eluniversal", "eltiempo"],
      "boyaca":             ["boyaca7dias", "eltiempo"],
      "caldas":             ["bcnoticias", "eltiempo"],
      "caqueta":            ["eltiempo"],
      "cauca":              ["diariodelcauca", "eltiempo"],
      "cesar":              ["cesarnoticias", "elpaisvallenato", "elpilon", "eltiempo"],
      "choco":              ["eltiempo"],
      "cordoba":            ["chicanoticias", "rionoticias", "eltiempo"],
      "cundinamarca":       ["eltiempo"],
      "guaviare":           ["marandua", "eltiempo"],
      "huila":              ["eltiempo"],
      "la guajira":         ["diariodelnorte", "laguajirahoy", "elpilon", "eltiempo"],
      "magdalena":          ["santamartaaldia", "elheraldo", "eltiempo"],
      "meta":               ["llanoalmundo", "periodicodelmeta", "viveelmeta", "eltiempo"],
      "narino":             ["diariodelsur", "eltiempo"],
      "norte de santander": ["eltiempo"],
      "putumayo":           ["miputumayo", "eltiempo"],
      "quindio":            ["elquindiano", "quindionoticias", "eltiempo"],
      "risaralda":          ["elexpreso", "ciudadregion", "eltiempo"],
      "san andres":         ["archipielagopress", "eltiempo"],
      "santander":          ["corrillos", "eltiempo"],
      "sucre":              ["chicanoticias", "rionoticias", "eltiempo"],
      "tolima":             ["eltiempo"],
      "valle del cauca":    ["diariooccidente", "eltiempo"],
      "vaupes":             ["eltiempo"],
      "vichada":            ["elmorichal", "eltiempo"]
    };
    const PERIODICOS_DEFECTO = ["eltiempo"];
    const FUENTES_NACIONALES = { "eltiempo": true, "verdadabierta": true };

    const NOMBRES_PERIODICOS = {
      "elcolombiano": "El Colombiano", "elheraldo": "El Heraldo", "eluniversal": "El Universal",
      "bcnoticias": "BC Noticias", "diariodelcauca": "Diario del Cauca", "cesarnoticias": "Cesar Noticias",
      "elpaisvallenato": "El País Vallenato", "elpilon": "El Pilón", "chicanoticias": "Chica Noticias",
      "rionoticias": "Río Noticias", "marandua": "Marandúa Stereo", "laguajirahoy": "La Guajira Hoy",
      "diariodelnorte": "Diario del Norte",
      "santamartaaldia": "Santa Marta Al Día", "llanoalmundo": "Llano al Mundo",
      "periodicodelmeta": "Periódico del Meta", "viveelmeta": "Vive el Meta", "diariodelsur": "Diario del Sur",
      "miputumayo": "Mi Putumayo", "elquindiano": "El Quindiano", "quindionoticias": "Quindío Noticias",
      "elexpreso": "El Expreso", "ciudadregion": "Ciudad Región", "archipielagopress": "The Archipelago Press",
      "corrillos": "Corrillos", "diariooccidente": "Diario Occidente", "elmorichal": "El Morichal",
      "boyaca7dias": "Boyacá 7 Días", "eltiempo": "El Tiempo", "verdadabierta": "VerdadAbierta"
    };

    // Fases REALES del análisis, en el orden en que las reporta GET /progreso.
    // Cada una manda un tramo fijo de la barra; el poll (no el tiempo) decide en
    // cuál estamos. "idle" no está en el mapa: se ignora (ni antes de empezar ni
    // al terminar mueve la barra hacia atrás). El texto/dots salen de aquí.
    const FASES_INFO = {
      buscando:     { texto: "Buscando noticias…",       tramo: 0 },
      clasificando: { texto: "Clasificando artículos…",  tramo: 1 },
      calculando:   { texto: "Calculando el índice…",    tramo: 2 },
    };
    // Tramos [inicio, fin] en %. La barra sube DENTRO del tramo por animación
    // (cosmética, sin tocar el fin) y SALTA al inicio del siguiente cuando el poll
    // confirma el cambio de fase. Nunca llega a 100% hasta que /analizar responde.
    const TRAMOS = [[0, 33], [33, 66], [66, 100]];
    const N_FASES = 3;                 // cantidad de dots
    const MARGEN_TRAMO = 4;            // % por debajo del fin del tramo (no llegar al límite)

    // ── Estado ────────────────────────────────────────────────────────────────
    var territorioAnalizado = "";
    var pollId = null, animId = null, tInicio = 0;
    var tramoActual = 0, barraProgreso = 0;

    var $ = function (id) { return document.getElementById(id); };
    var selDepartamento = $("sel-departamento");
    var inputLugar = $("input-lugar");
    var btnAnalizar = $("btn-analizar");
    var fechaInicio = $("fecha-inicio");
    var fechaFin = $("fecha-fin");

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function norm(s) {
      return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    }

    // ── Poblar el <select> de departamentos ────────────────────────────────────
    selDepartamento.innerHTML = '<option value="">Selecciona un departamento</option>' +
      DEPARTAMENTOS.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join("");

    // ── Chips de fuentes ────────────────────────────────────────────────────────
    function resolverPeriodicos(depto) {
      return MAPA_TERRITORIO_PERIODICOS[norm(depto)] || PERIODICOS_DEFECTO;
    }
    function pintarFuentes(depto) {
      if (!depto) { $("fuentes-panel").hidden = true; return; }
      var fuentes = resolverPeriodicos(depto);
      $("chips-fuentes").innerHTML = fuentes.map(function (p) {
        var nacional = !!FUENTES_NACIONALES[p];
        var cls = nacional ? "chip chip-blue" : "chip chip-green";
        var suf = nacional ? ' <span style="opacity:.6;font-size:9px;">nacional</span>' : "";
        return '<span class="' + cls + '">' + esc(NOMBRES_PERIODICOS[p] || p) + suf + '</span>';
      }).join("");
      $("fuentes-panel").hidden = false;
    }

    // ── Valores derivados ─────────────────────────────────────────────────────
    function fechasValidas() {
      var a = fechaInicio.value, b = fechaFin.value;
      return !!a && !!b && a <= b;
    }
    function territorioValor() {
      var lugar = inputLugar.value.trim();
      return lugar || selDepartamento.value;   // lugar específico o el departamento
    }

    // ── Refrescar botón + fuentes ──────────────────────────────────────────────
    function refrescar() {
      var depto = selDepartamento.value;
      selDepartamento.classList.toggle("sel", !!depto);
      pintarFuentes(depto);

      var lugar = inputLugar.value.trim();
      var listo = !!depto && fechasValidas();
      btnAnalizar.disabled = !listo;
      if (!depto) {
        btnAnalizar.textContent = "Selecciona un departamento";
      } else if (lugar) {
        btnAnalizar.textContent = "Analizar " + lugar + ", " + depto;
      } else {
        btnAnalizar.textContent = "Analizar " + depto;
      }
    }

    selDepartamento.addEventListener("change", refrescar);
    inputLugar.addEventListener("input", refrescar);
    fechaInicio.addEventListener("change", refrescar);
    fechaFin.addEventListener("change", refrescar);

    // ── Loading helpers (fase real por poll a GET /progreso) ──────────────────
    function pintarDots() {
      var html = "";
      for (var i = 0; i < N_FASES; i++) html += '<div class="dot' + (i <= tramoActual ? " on" : "") + '"></div>';
      $("dots").innerHTML = html;
    }
    function _mmss(seg) {
      var m = Math.floor(seg / 60), s = seg % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
    function pintarBarra() { $("barra-progreso").style.width = barraProgreso.toFixed(2) + "%"; }

    // Sube suave hacia el fin del tramo actual sin llegar a tocarlo (easing
    // exponencial hacia fin-MARGEN). No avanza de tramo: eso solo lo hace el poll.
    function animarBarra() {
      var objetivo = TRAMOS[tramoActual][1] - MARGEN_TRAMO;
      if (barraProgreso < objetivo) {
        barraProgreso += (objetivo - barraProgreso) * 0.06;
        pintarBarra();
      }
    }

    // Aplica la fase que devolvió el poll. Nunca retrocede (fases monótonas): si
    // llega "idle" u otra desconocida, o una fase anterior, deja lo que ya se ve.
    function aplicarFase(fase) {
      var info = FASES_INFO[fase];
      if (!info || info.tramo < tramoActual) return;
      $("loading-etapa").textContent = info.texto;
      if (info.tramo > tramoActual) {
        tramoActual = info.tramo;
        barraProgreso = TRAMOS[tramoActual][0];   // salta al inicio del nuevo tramo
        pintarBarra();
        pintarDots();
      }
    }

    // Contador real (1 Hz) + poll de la fase real. Van juntos en un solo tick para
    // que el tiempo siga corriendo aunque un poll falle (ahí se conserva la fase).
    function tickLoading() {
      var elapsed = Math.max(0, Math.floor((Date.now() - tInicio) / 1000));
      $("loading-tiempo").textContent = "Transcurrido " + _mmss(elapsed);
      fetch(API_BASE + "/progreso", { headers: { "ngrok-skip-browser-warning": "69420" } })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.fase) aplicarFase(j.fase); })
        .catch(function () { /* sin conexión momentánea: se conserva la última fase */ });
    }

    function iniciarLoading() {
      tramoActual = 0; barraProgreso = 0;
      $("loading-etapa").textContent = FASES_INFO.buscando.texto;
      $("loading-tiempo").textContent = "Transcurrido 0:00";
      pintarBarra();
      pintarDots();
      clearInterval(pollId); clearInterval(animId);
      tickLoading();                          // primer poll inmediato, sin esperar 1s
      pollId = setInterval(tickLoading, 1000);
      animId = setInterval(animarBarra, 60);  // avance cosmético continuo dentro del tramo
    }

    function detenerLoading() {
      clearInterval(pollId); clearInterval(animId);
      pollId = null; animId = null;
    }
    function mostrar(seccion) {
      $("form").hidden = seccion !== "form";
      $("estado-loading").hidden = seccion !== "loading";
      $("estado-error").hidden = seccion !== "error";
      $("estado-sugerencia").hidden = seccion !== "sugerencia";
    }

    // Nombre oficial del departamento (respetando tildes) si `txt` es uno, o null.
    function nombreDeptoOficial(txt) {
      var n = norm(txt);
      for (var i = 0; i < DEPARTAMENTOS.length; i++) {
        if (norm(DEPARTAMENTOS[i]) === n) return DEPARTAMENTOS[i];
      }
      return null;
    }

    // Elegir una sugerencia: sigue DERECHO con el análisis (no vuelve al form).
    // Una sugerencia de homónimo viene como "Villanueva (La Guajira)": el
    // paréntesis es el departamento -> va al departamento_hint (dropdown), no al
    // territorio. Se re-analiza sin forzar (forzar solo lo activan los botones
    // "No, buscar igual").
    function elegirSugerencia(sug) {
      var m = /^\s*(.+?)\s*\(([^)]+)\)\s*$/.exec(sug);
      var oficial = m ? nombreDeptoOficial(m[2]) : null;
      if (oficial) {
        selDepartamento.value = oficial;   // homónimo: fija el departamento
        inputLugar.value = m[1];
      } else {
        inputLugar.value = sug;            // nombre simple; el depto elegido se mantiene
      }
      refrescar();
      analizar(false);
    }

    // Pantalla de "¿Quisiste decir...?": botones por sugerencia (siguen el
    // análisis) + "No, buscar igual" (fuerza la búsqueda original).
    function mostrarSugerencias(lista, msg) {
      $("sug-msg").textContent = msg || "¿Quisiste decir alguno de estos?";
      var cont = $("sug-botones");
      cont.innerHTML = "";
      (lista || []).forEach(function (nombre) {
        var b = document.createElement("button");
        b.className = "btn-primary";
        b.style.marginTop = "0";
        b.textContent = nombre;
        b.addEventListener("click", function () { elegirSugerencia(nombre); });
        cont.appendChild(b);
      });
      mostrar("sugerencia");
    }

    // ── Análisis (POST + JSON síncrono) ──────────────────────────────────────
    // `forzar` es un parámetro por-llamada, no un estado: nunca queda "pegado"
    // entre búsquedas. Solo lo ponen en true los botones "No, buscar igual";
    // toda otra entrada (Analizar, Reintentar, elegir sugerencia) manda false.
    function analizar(forzar) {
      var depto = selDepartamento.value;
      if (!(depto && fechasValidas())) return;
      var territorio = territorioValor();

      territorioAnalizado = territorio;
      $("loading-territorio").textContent = territorio;
      tInicio = Date.now();
      mostrar("loading");

      // Fase real por poll a GET /progreso (1 Hz) + barra determinada anclada a la
      // fase. La barra arranca en 0% y sube sola dentro del tramo; el poll la hace
      // saltar de tramo. Nunca llega a 100% hasta que /analizar responda.
      iniciarLoading();

      fetch(API_BASE + "/analizar", {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "69420" },
        body: JSON.stringify({
          territorio: territorio,
          departamento_hint: depto,        // siempre el departamento elegido
          forzar_lugar: !!forzar,          // "No, buscar igual"
          fecha_inicio: fechaInicio.value,
          fecha_fin: fechaFin.value,
        }),
      })
        .then(function (res) {
          if (!res.ok) {
            return res.json().catch(function () { return {}; }).then(function (j) {
              var e = new Error(j.detail || ("La API respondió " + res.status));
              e.forzable = !!j.forzable;        // la API lo marca; no se infiere del mensaje
              e.esValidacion = ("forzable" in j); // solo el filtro territorial trae la clave
              throw e;
            });
          }
          return res.json();
        })
        .then(function (data) {
          detenerLoading();
          if (data && data.sugerencia) {   // municipio no exacto → pantalla de sugerencias
            mostrarSugerencias(data.sugerencia, data.msg);
            return;
          }
          // Respuesta OK: recién ahora la barra puede completar el 100%.
          barraProgreso = 100; pintarBarra();
          sessionStorage.setItem("radar_resultado", JSON.stringify(data));
          window.location.href = "visualizacion_riesgo.html" + window.location.search;
        })
        .catch(function (err) {
          detenerLoading();
          var forzable = !!err.forzable;
          var esValidacion = !!err.esValidacion;
          $("error-msg").textContent = err.message || "No se pudo conectar con la API";
          // forzable => advertencia (ámbar): no está en la división oficial pero se
          // puede analizar igual. Resto => error (rojo): fallo real o rechazo no forzable.
          $("estado-error").classList.toggle("warn", forzable);
          $("err-title").textContent = forzable
            ? "Territorio no encontrado en la división oficial"
            : "No se pudo completar el análisis";
          $("btn-forzar-error").hidden = !forzable;
          // Reintentar solo si el resultado podría cambiar: NO en rechazos de
          // validación (deterministas); sí en fallos reales y en sin-cobertura.
          $("btn-reintentar").hidden = esValidacion;
          mostrar("error");
        });
    }

    function nuevaConsulta() {
      detenerLoading();
      selDepartamento.value = "";
      inputLugar.value = "";
      tramoActual = 0; barraProgreso = 0;
      $("btn-forzar-error").hidden = true;   // no arrastrar el botón entre consultas
      refrescar();
      mostrar("form");
    }

    // ── Eventos ───────────────────────────────────────────────────────────────
    btnAnalizar.addEventListener("click", function () { analizar(false); });
    $("btn-reintentar").addEventListener("click", function () { analizar(false); });
    $("btn-buscar-igual").addEventListener("click", function () { analizar(true); });
    $("btn-forzar-error").addEventListener("click", function () { analizar(true); });
    $("btn-nueva-error").addEventListener("click", nuevaConsulta);

    // ── Fechas por defecto: fin = hoy, inicio = hace un mes ────────────────────
    // Fecha LOCAL, no UTC: toISOString() en UTC-5 adelantaria un dia despues de las
    // 7pm. Se arma el YYYY-MM-DD a mano. Al restar el mes se clampea al ultimo dia
    // del mes anterior (31-mar => 28/29-feb, no 3-mar por el desborde de setMonth).
    function fechaLocalISO(d) {
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var dd = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + dd;
    }
    function haceUnMes(d) {
      var dia = d.getDate();
      var r = new Date(d.getFullYear(), d.getMonth() - 1, 1);  // primer dia del mes anterior
      var ultimo = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();  // su ultimo dia
      r.setDate(Math.min(dia, ultimo));                        // clamp: evita el desborde
      return r;
    }
    (function () {
      var hoy = new Date();
      fechaFin.value = fechaLocalISO(hoy);
      fechaInicio.value = fechaLocalISO(haceUnMes(hoy));
    })();

    // init
    refrescar();
    pintarDots();
  </script>
</body>
</html>
